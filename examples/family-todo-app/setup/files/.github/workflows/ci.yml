# CI = "Continuous Integration": every pull request is checked automatically by GitHub.
# If any step fails, the PR shows a red ❌ and must be fixed before merging.
# CD ("Continuous Deployment") is done by your host: it deploys a preview for each PR
# and production when a PR is merged into main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint (code style & common mistakes)
        run: npm run lint --if-present
      - name: Typecheck (catches wrong data types)
        run: npm run typecheck --if-present
      - name: Unit tests
        run: npm test --if-present
      - name: Build (proves it can be deployed)
        run: npm run build --if-present

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --no-banner --redact
