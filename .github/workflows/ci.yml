# SkillTalk's own CI (we follow the same rules we generate for users).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Tests (interview, rendering, hooks, git safety, bootstrap)
        working-directory: backend
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          pytest -q
      - name: Example skill is up to date
        working-directory: backend
        run: |
          python -m app.demo --write
          git diff --exit-code -- ../examples || (echo "Run 'python -m app.demo --write' and commit the result" && exit 1)
